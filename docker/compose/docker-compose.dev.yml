

services:

  postgres:

    image: postgres:18

    restart: unless-stopped

    env_file:
      - ../env/database.env

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - Businesspilot_network



  pgadmin:

    image: dpage/pgadmin4

    container_name: Businesspilot_pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@Businesspilot.ai
      PGADMIN_DEFAULT_PASSWORD: Sanji@1322M

    ports:
      - "5050:80"

    depends_on:
      - postgres

    networks:
      - Businesspilot_network



volumes:

  postgres_data:



networks:

  Businesspilot_network:

    driver: bridge